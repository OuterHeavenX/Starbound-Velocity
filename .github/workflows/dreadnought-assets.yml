name: Integrate Dreadnought Boss Assets

on:
  push:
    paths:
      - '.github/workflows/dreadnought-assets.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add boss art and patch renderer
        shell: bash
        run: |
          mkdir -p assets/bosses public/game/assets/bosses
          cat > /tmp/p1.b64 <<'EOF'
