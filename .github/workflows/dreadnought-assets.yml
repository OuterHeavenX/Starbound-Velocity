name: Integrate Dreadnought Boss Renderer

on:
  push:
    paths:
      - '.github/workflows/dreadnought-assets.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Dreadnought renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path('game.js'),Path('public/game/game.js')]
          for p in paths:
              s=p.read_text()
              if 'const dreadnoughtImages=' not in s:
                  anchor="  const vanguardSprite={w:86,h:96,ready:false};vanguardShipImage.addEventListener('load',()=>{vanguardSprite.ready=true;});\n"
                  insert=anchor+"  // Authored Dreadnought boss art. Attack logic and collision geometry remain independent from sprite dimensions.\n  const dreadnoughtImages=[null,'phase1','phase2','phase3'].map((phase,index)=>{if(!phase)return null;const img=new Image();img.decoding='async';img.src=`assets/bosses/dreadnought-${phase}.webp`;return img;});\n  const dreadnoughtSprite={w:236,h:220};\n"
                  if anchor not in s: raise SystemExit(f'missing image anchor in {p}')
                  s=s.replace(anchor,insert,1)
              old="b.phase=ratio>.75?4:ratio>.5?3:ratio>.25?2:1;if(b.phase!==b.lastPhase)"
              new="b.phase=b.type==='megashock'?(ratio>.66?3:ratio>.33?2:1):(ratio>.75?4:ratio>.5?3:ratio>.25?2:1);if(b.phase!==b.lastPhase)"
              if old in s: s=s.replace(old,new,1)
              old_ui="ui.bossTimer.textContent=`${Math.ceil(b.hp)} / ${b.maxHp} · PHASE ${5-b.phase}`;"
              new_ui="ui.bossTimer.textContent=`${Math.ceil(b.hp)} / ${b.maxHp} · PHASE ${b.type==='megashock'?4-b.phase:5-b.phase}`;"
              if old_ui in s: s=s.replace(old_ui,new_ui,1)
              start=s.find('  function drawDreadnought(b){')
              end=s.find('\n  function drawPlasma',start)
              if start<0 or end<0: raise SystemExit(f'missing boss renderer in {p}')
              newfn="""  function drawDreadnought(b){ctx.save();ctx.translate(b.x,b.y);ctx.shadowBlur=28;ctx.shadowColor=b.hitFlash?'#fff':'#ff315d';if(b.type==='megashock'){const artPhase=b.phase>=3?1:b.phase===2?2:3,img=dreadnoughtImages[artPhase],renderW=dreadnoughtSprite.w,renderH=dreadnoughtSprite.h;if(img?.complete&&img.naturalWidth){ctx.save();ctx.globalCompositeOperation='screen';ctx.drawImage(img,-renderW/2,-renderH*.54,renderW,renderH);ctx.globalCompositeOperation='source-over';if(b.hitFlash){ctx.globalCompositeOperation='source-atop';ctx.globalAlpha=.62;ctx.fillStyle='#fff';ctx.fillRect(-renderW/2,-renderH*.54,renderW,renderH);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}ctx.restore();ctx.save();ctx.globalAlpha=.6+.2*Math.sin(b.t*8);ctx.fillStyle=artPhase===3?'#fff1b8':'#ff315d';ctx.shadowBlur=26;ctx.shadowColor=artPhase===3?'#ff6a00':'#ff315d';ctx.beginPath();ctx.arc(0,artPhase===1?5:10,artPhase===3?13:9,0,Math.PI*2);ctx.fill();ctx.restore();}else{ctx.strokeStyle=b.hitFlash?'#fff':'#ff315d';ctx.fillStyle=b.hitFlash?'#756b79':'#08040d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,72);ctx.lineTo(-82,-40);ctx.lineTo(-28,-58);ctx.lineTo(0,-35);ctx.lineTo(28,-58);ctx.lineTo(82,-40);ctx.closePath();ctx.fill();ctx.stroke();}}else if(b.type==='hydra'){ctx.strokeStyle=b.hitFlash?'#fff':'#ff315d';ctx.fillStyle=b.hitFlash?'#756b79':'#08040d';ctx.lineWidth=2;const centers=b.split?[-62,62]:[0];for(let n=0;n<centers.length;n++){ctx.save();ctx.translate(centers[n],b.split?Math.sin(b.t*4+n)*18:0);ctx.rotate(Math.PI/4+b.t*(b.split?(n?-.7:.7):.12));ctx.strokeRect(-38,-38,76,76);ctx.strokeRect(-20,-20,40,40);ctx.restore();if(b.split){ctx.fillStyle='#260613';ctx.fillRect(centers[n]-38,58,76,4);ctx.fillStyle='#ff315d';ctx.fillRect(centers[n]-38,58,76*Math.max(0,b.headHp[n]/(b.maxHp/2)),4);}}}else{ctx.strokeStyle=b.hitFlash?'#fff':'#ff315d';ctx.fillStyle=b.hitFlash?'#756b79':'#08040d';ctx.lineWidth=2;for(let i=0;i<8;i++){const x=(i-3.5)*25,y=Math.sin(b.t*2+i*.7)*25+i*5-30,r=24-i*1.2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}if(b.shieldNodes>0){ctx.strokeStyle='#ffd6ff';ctx.beginPath();ctx.arc(0,10,112,0,Math.PI*2);ctx.stroke();for(let i=0;i<b.shieldNodes;i++){const a=i/4*Math.PI*2+b.t;ctx.beginPath();ctx.arc(Math.cos(a)*112,10+Math.sin(a)*112,10,0,Math.PI*2);ctx.stroke();}}ctx.fillStyle='#ff315d';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.fillStyle='#260613';ctx.fillRect(b.x-82,b.y-88,164,5);ctx.fillStyle='#ff315d';ctx.fillRect(b.x-82,b.y-88,164*Math.max(0,b.hp/b.maxHp),5);ctx.strokeStyle='#ff7790';ctx.strokeRect(b.x-82,b.y-88,164,5);}\n"""
              s=s[:start]+newfn+s[end:]
              p.write_text(s)
          PY
          node --check game.js
          node --check public/game/game.js
          cmp game.js public/game/game.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js public/game/game.js
          git commit -m 'Integrate three-phase Dreadnought boss renderer'
          git push
