name: Bootstrap complete source

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.part-* > /tmp/starbound-source.b64
          base64 --decode /tmp/starbound-source.b64 > /tmp/starbound-source.zip
          rm -rf /tmp/starbound-unpack
          mkdir -p /tmp/starbound-unpack
          unzip -q /tmp/starbound-source.zip -d /tmp/starbound-unpack
          shopt -s dotglob
          cp -a /tmp/starbound-unpack/Starbound-Velocity/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit full extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Starbound Velocity source'
          git push origin HEAD:main
