name: Import Starbound Velocity live runtime

on:
  push:
    paths:
      - '.bootstrap/IMPORT_LIVE'

permissions:
  contents: write

jobs:
  import-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch deployed game runtime
        shell: bash
        run: |
          set -euo pipefail
          base='https://starbound-velocity.jimmyflete.chatgpt.site/game'
          mkdir -p public/game
          curl --fail --location --retry 3 "$base/index.html" -o index.html
          curl --fail --location --retry 3 "$base/game.js" -o game.js
          curl --fail --location --retry 3 "$base/styles.css" -o styles.css
          cp index.html public/game/index.html
          cp game.js public/game/game.js
          cp styles.css public/game/styles.css
          test -s index.html
          test -s game.js
          test -s styles.css
          grep -q 'STARBOUND' index.html
          grep -q 'runtime recovery' game.js
          rm -f .bootstrap/IMPORT_LIVE
      - name: Commit imported runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import deployed Starbound Velocity runtime'
          git push origin HEAD:main
